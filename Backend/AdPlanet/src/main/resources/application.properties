spring.application.name=adplanet
spring.config.import=optional:file:adplanet.env[.properties]

# Server Configuration
server.port=8081

# Database Configuration
spring.datasource.url=jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB_NAME}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# SSH Tunnel Configuration
ssh.host=${SSH_HOST}
ssh.username=${SSH_USERNAME}
ssh.private-key-path=${SSH_PRIVATE_KEY_PATH}

# RDS Configuration
rds.host=${RDS_HOST}
rds.port=${RDS_PORT}

# Database Connection
db.host=${DB_HOST}
db.port=${DB_PORT}

# Redis Configuration
redis.host=${REDIS_HOST}
redis.port=${REDIS_PORT}
redis.local-port=${REDIS_LOCAL_PORT}

# Spring Data Redis Configuration
spring.data.redis.host=localhost
spring.data.redis.port=${REDIS_LOCAL_PORT}

# JWT Configuration
jwt.secret=${JWT_SECRET}
jwt.access-token.expiration=${JWT_ACCESS_TOKEN_EXPIRATION}
jwt.refresh-token.expiration=${JWT_REFRESH_TOKEN_EXPIRATION}

# SSAFY OAuth Configuration
oauth.ssafy.client-id=${CLIENT_ID}
oauth.ssafy.client-secret=${CLIENT_SECRET}
oauth.ssafy.redirect-uri=${REDIRECT_URI}

# Rabbit MQ
spring.rabbitmq.host=${MQ_HOST}
spring.rabbitmq.port=${MQ_PORT}
spring.rabbitmq.username=${MQ_USERNAME}
spring.rabbitmq.password=${MQ_PASSWORD}

app.queue.poster=${MQ_QUEUE_POSTER}
#app.worker.python.url=${MQ_WORKER_URL}

# RabbitMQ Connection Pool 설정
spring.rabbitmq.cache.connection.mode=connection
spring.rabbitmq.cache.connection.size=2

# RabbitMQ Consumer 설정
spring.rabbitmq.listener.simple.acknowledge-mode=auto
spring.rabbitmq.listener.simple.concurrency=1
spring.rabbitmq.listener.simple.max-concurrency=1
spring.rabbitmq.listener.simple.prefetch=1
spring.rabbitmq.listener.simple.auto-startup=true
spring.rabbitmq.listener.simple.default-requeue-rejected=false

# python
#adplanet.ai.base-url=${ADPLANET_AI_BASE_URL:http://127.0.0.1:8000}
#adplanet.ai.connect-timeout-ms=3000
#adplanet.ai.read-timeout-sec=120

# S3
adplanet.s3.bucket=ssafyapp-stg-project-prv-data
adplanet.s3.prefix=9qm4mj/
adplanet.s3.region=ap-northeast-2

adplanet.s3.access-key=${AWS_ACCESS_KEY_ID:}
adplanet.s3.secret-key=${AWS_SECRET_ACCESS_KEY:}

# GMS
adplanet.gms.responses-url=https://gms.ssafy.io/gmsapi/api.openai.com/v1/responses
adplanet.gms.api-key=${GMS_KEY}
adplanet.gms.timeout=60s
