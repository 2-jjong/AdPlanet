spring.application.name=adplanet
spring.config.import=optional:file:adplanet.env[.properties]

# Server Configuration
server.port=8081

# Database Configuration
spring.datasource.url=jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB_NAME}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# SSH Tunnel Configuration
ssh.host=${SSH_HOST}
ssh.username=${SSH_USERNAME}
ssh.private-key-path=${SSH_PRIVATE_KEY_PATH}

# RDS Configuration
rds.host=${RDS_HOST}
rds.port=${RDS_PORT}

# Database Connection
db.host=${DB_HOST}
db.port=${DB_PORT}

# JWT Configuration
jwt.secret=${JWT_SECRET}
jwt.access-token.expiration=${JWT_ACCESS_TOKEN_EXPIRATION}
jwt.refresh-token.expiration=${JWT_REFRESH_TOKEN_EXPIRATION}

# SSAFY OAuth Configuration
oauth.ssafy.client-id=${CLIENT_ID}ehzjCannot resolve configuration property 'app.queue.image'
oauth.ssafy.client-secret=${CLIENT_SECRET}
oauth.ssafy.redirect-uri=${REDIRECT_URI}

# Rabbit MQ
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest

app.queue.image=poster.image.queue
app.worker.python.url=http://localhost:8000/generate

app.queue.test=ham.test.queue
